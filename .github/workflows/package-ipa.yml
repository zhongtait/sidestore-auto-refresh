name: Build and Package LiveContainer + SideStore Auto-Refresh IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/package-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build and Package LiveContainer-SideStore v6.0.1
    runs-on: macos-latest
    steps:
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout sidestore-auto-refresh
        uses: actions/checkout@v4
        with:
          path: sidestore-auto-refresh

      - name: Checkout LiveContainer (NRG-Wardog v6.0.1 lineage)
        uses: actions/checkout@v4
        with:
          repository: NRG-Wardog/LiveContainer
          ref: 5d2498d4dfffa14c031ca1481ab9f3417bfccc3f
          path: LiveContainer
          submodules: recursive

      - name: Verify Patch Unit Tests
        working-directory: sidestore-auto-refresh
        run: |
          python3 -m unittest \
            tests/test_guest_orientation.py \
            tests/test_launch_refresh_policy.py \
            tests/test_refresh_recovery_deadlock.py

      - name: Apply sidestore-auto-refresh patches
        run: |
          python3 sidestore-auto-refresh/scripts/patch_guest_orientation.py LiveContainer
          python3 sidestore-auto-refresh/scripts/patch_launch_refresh_policy.py LiveContainer
          python3 sidestore-auto-refresh/scripts/patch_refresh_recovery_deadlock.py LiveContainer

      - name: Build Patched Components (TweakLoader & LiveContainerSwiftUI)
        working-directory: LiveContainer
        run: |
          mkdir -p "$PWD/build-components"
          if xcodebuild -project LiveContainer.xcodeproj \
              -target TweakLoader \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              CONFIGURATION_BUILD_DIR="$PWD/build-components"; then
            echo "Successfully built TweakLoader via xcodebuild"
          else
            echo "Falling back to direct clang compilation for TweakLoader"
            SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
            xcrun clang -arch arm64 -target arm64-apple-ios15.0 -dynamiclib \
              -install_name /usr/local/lib/TweakLoader.dylib \
              -fobjc-arc \
              -isysroot "$SDK_PATH" \
              -I . -I LiveContainer \
              -framework Foundation -framework UIKit -framework Security -framework LocalAuthentication \
              -framework UniformTypeIdentifiers -framework UserNotifications \
              -Wl,-U,_OBJC_CLASS_\$_FBSSceneParameters \
              -Wl,-U,_OBJC_CLASS_\$_LSApplicationWorkspace \
              -Wl,-U,_OBJC_CLASS_\$_DOCConfiguration \
              TweakLoader/DocumentPicker.m TweakLoader/Notification.m TweakLoader/TweakLoader.m TweakLoader/UIKit+GuestHooks.m \
              -o "$PWD/build-components/TweakLoader.dylib"
          fi
          test -f "$PWD/build-components/TweakLoader.dylib"
          ls -la "$PWD/build-components/TweakLoader.dylib"

          # Build dependencies in topological order and then LiveContainerSwiftUI framework
          echo "1. Building LiveContainerShared framework"
          xcodebuild -project LiveContainer.xcodeproj \
              -target LiveContainerShared \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              CONFIGURATION_BUILD_DIR="$PWD/build-components"

          echo "2. Building SideStoreSupport framework"
          xcodebuild -project LiveContainer.xcodeproj \
              -target SideStoreSupport \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              CONFIGURATION_BUILD_DIR="$PWD/build-components"

          echo "3. Building LiveContainerSwiftUI framework"
          xcodebuild -project LiveContainer.xcodeproj \
              -target LiveContainerSwiftUI \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              CONFIGURATION_BUILD_DIR="$PWD/build-components"

          test -f "$PWD/build-components/LiveContainerSwiftUI.framework/LiveContainerSwiftUI"
          ls -la "$PWD/build-components/LiveContainerSwiftUI.framework/LiveContainerSwiftUI"

      - name: Download Official v6.0.1 Base IPA
        run: |
          curl -fSL "https://github.com/NRG-Wardog/sidestore-auto-refresh/releases/download/v6.0.1/LiveContainer-SideStore-v6.0.1.ipa" -o official-v6.0.1.ipa
          shasum -a 256 official-v6.0.1.ipa
          echo "eaca3f28b32b4a14acc0b1bf16237348f528de18a6eed37552b80d65fb9f84d3  official-v6.0.1.ipa" | shasum -a 256 -c -

      - name: Package LiveContainer-SideStore-v6.0.1.ipa with Patches
        run: |
          set -euxo pipefail
          command -v ldid || brew install ldid
          mkdir -p ipa-work
          unzip -q official-v6.0.1.ipa -d ipa-work

          # Locate and replace target TweakLoader.dylib in the official base IPA
          TARGET_TL=$(find ipa-work -name "TweakLoader.dylib" | head -n 1)
          if [ -z "$TARGET_TL" ]; then
            TARGET_TL="ipa-work/Payload/LiveContainer.app/Frameworks/TweakLoader.dylib"
          fi
          echo "Target TweakLoader path: $TARGET_TL"
          cp LiveContainer/build-components/TweakLoader.dylib "$TARGET_TL"
          ldid -S"" "$TARGET_TL"

          # Locate and replace target LiveContainerSwiftUI in the official base IPA
          TARGET_SWIFTUI=$(find ipa-work -name "LiveContainerSwiftUI" -type f | grep "LiveContainerSwiftUI.framework" | head -n 1)
          test -n "$TARGET_SWIFTUI"
          test -f "$TARGET_SWIFTUI"
          test -f LiveContainer/build-components/LiveContainerSwiftUI.framework/LiveContainerSwiftUI
          echo "Target LiveContainerSwiftUI path: $TARGET_SWIFTUI"
          cp LiveContainer/build-components/LiveContainerSwiftUI.framework/LiveContainerSwiftUI "$TARGET_SWIFTUI"
          ldid -S"" "$TARGET_SWIFTUI"

          # Locate and replace target SideStoreSupport in the official base IPA
          TARGET_SUPPORT=$(find ipa-work -name "SideStoreSupport" -type f | grep "SideStoreSupport.framework" | head -n 1)
          test -n "$TARGET_SUPPORT"
          test -f "$TARGET_SUPPORT"
          test -f LiveContainer/build-components/SideStoreSupport.framework/SideStoreSupport
          echo "Target SideStoreSupport path: $TARGET_SUPPORT"
          cp LiveContainer/build-components/SideStoreSupport.framework/SideStoreSupport "$TARGET_SUPPORT"
          ldid -S"" "$TARGET_SUPPORT"

          # Verify that SideStoreApp.framework retains V3SideStoreService (avoiding SS-READY-C09-L19)
          # and that all patched binaries contain their expected symbols across all Mach-O segments
          python3 - "$TARGET_TL" "$TARGET_SWIFTUI" "$TARGET_SUPPORT" <<'PY'
          import sys
          from pathlib import Path

          target_tl, target_swiftui, target_support = sys.argv[1:4]
          checks = {
              "ipa-work/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore": [
                  b"V3SideStoreService",
                  b"execute:reply:",
              ],
              target_support: [
                  b"v3Execute",
                  b"refreshForHost:admissionID:progress:completion:",
                  b"finishHostRefresh:runID:admissionID:verification:",
                  b"retireOrphanedRefresh",
              ],
              target_tl: [
                  b"_forceUpdateInterfaceOrientationIncludingRetargeting:",
                  b"hook_makeKeyAndVisible",
              ],
              target_swiftui: [
                  b"retireOrphanedRefresh",
              ],
          }
          for bin_path, tokens in checks.items():
              p = Path(bin_path)
              assert p.is_file() and p.stat().st_size > 0, f"Missing or empty binary: {bin_path}"
              data = p.read_bytes()
              for token in tokens:
                  assert token in data, f"Missing {token!r} in {bin_path} (size={len(data)})"
              print(f"Verified {bin_path} ({len(data)} bytes): {[t.decode() for t in tokens]}")
          PY
          echo "Verification passed: SideStoreApp, SideStoreSupport, TweakLoader, and LiveContainerSwiftUI verified successfully."

          # Repackage the final IPA
          cd ipa-work
          zip -qr ../LiveContainer-SideStore-v6.0.1.ipa Payload -x "._*" -x ".DS_Store" -x "__MACOSX"
          cd ..

          shasum -a 256 LiveContainer-SideStore-v6.0.1.ipa
          ls -lh LiveContainer-SideStore-v6.0.1.ipa

      - name: Upload LiveContainer-SideStore-v6.0.1.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore-v6.0.1.ipa
          path: LiveContainer-SideStore-v6.0.1.ipa
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd sidestore-auto-refresh
          RELEASE_TAG="v6.0.1-orientation-patch"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ../LiveContainer-SideStore-v6.0.1.ipa --clobber
            gh release edit "$RELEASE_TAG" \
              --title "LiveContainer-SideStore v6.0.1 (Orientation & Recovery Deadlock Fix)" \
              --notes "Official v6.0.1 release with dynamic orientation engine for guest video player rotation, 6-day launch refresh guard, and recovery deadlock fix for interrupted/expired background refreshes."
          else
            gh release create "$RELEASE_TAG" \
              ../LiveContainer-SideStore-v6.0.1.ipa \
              --title "LiveContainer-SideStore v6.0.1 (Orientation & Recovery Deadlock Fix)" \
              --notes "Official v6.0.1 release with dynamic orientation engine for guest video player rotation, 6-day launch refresh guard, and recovery deadlock fix for interrupted/expired background refreshes."
          fi
